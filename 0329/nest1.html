<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>後代選擇器示範</title>
    <style>
      /* 導航區域的連結 */
      nav {
        a {
          color: #3498db;
        }
        ul li {
          color: #fb0f0f;
        }
      }

      /* 主要內容區域 */
      main {
        p {
          color: #34495e;
        }
        h2 {
          color: #2c3e50;
        }
        article p {
          color: #2c3e50;
        }
      }

      /* 側邊欄區域 */
      aside {
        p {
          color: #7f8c8d;
        }
        .widget-title {
          color: #9b59b6;
        }
      }

      /* 頁尾區域 */
      footer p {
        color: #95a5a6;
      }
      footer .social-links a {
        color: #e74c3c;
      }

      /* 卡片內容 */
      .card p {
        color: #2c3e50;
      }
      .card .title {
        color: #e74c3c;
      }
      .card .meta {
        color: #7f8c8d;
      }

      /* 表單內容 */
      form label {
        color: #34495e;
      }
      form input {
        color: #2c3e50;
      }
      form .help-text {
        color: #7f8c8d;
      }

      table tr:nth-child(even) {
        color: green;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="#">首頁</a></li>
        <li><a href="#">關於我們</a></li>
        <li><a href="#">聯絡我們</a></li>
      </ul>
    </nav>

    <main>
      <h2>主要內容</h2>
      <p>這是主要內容區域的段落。</p>

      <article>
        <p>這是文章內的段落。</p>
      </article>

      <div class="card">
        <h3 class="title">卡片標題</h3>
        <p>卡片內容段落。</p>
        <div class="meta">發布時間：2024-01-01</div>
      </div>
    </main>

    <aside>
      <h3 class="widget-title">側邊欄標題</h3>
      <p>側邊欄段落內容。</p>
    </aside>

    <table border="1">
      <thead>
        <tr>
          <td>1</td>
          <td>2</td>
          <td>3</td>
          <td>4</td>
          <td>5</td>
          <td>6</td>
        </tr>
        <tr>
          <td>1</td>
          <td>2</td>
          <td>3</td>
          <td>4</td>
          <td>5</td>
          <td>6</td>
        </tr>
        <tr>
          <td>1</td>
          <td>2</td>
          <td>3</td>
          <td>4</td>
          <td>5</td>
          <td>6</td>
        </tr>
        <tr>
          <td>1</td>
          <td>2</td>
          <td>3</td>
          <td>4</td>
          <td>5</td>
          <td>6</td>
        </tr>
      </thead>
    </table>

    <footer>
      <p>版權資訊</p>
      <div class="social-links">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
      </div>
    </footer>
  </body>
</html>
