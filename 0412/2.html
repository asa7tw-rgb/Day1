<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div.ls1 {
        width: 700px;
        height: 700px;
        background: #fc3 url("../picture/snoopy2.jpg") no-repeat center / cover;
      }

      div.ls2 {
        width: 700px;
        height: 700px;
        background-color: lightgreen;
        background-image:
          url("../picture/snoopy.jpg"), url("../picture/snoopy1.jpg");
        background-repeat: no-repeat, repeat-y;
        background-position:
          left top,
          center top;
      }

      div.ls3 {
        width: 700px;
        height: 700px;
        background-color: rgb(247, 161, 222);
        /* background-image: linear-gradient(
          90deg,
          rgba(42, 123, 155, 1) 0%,
          rgba(87, 199, 133, 1) 50%,
          rgb(250, 124, 152) 100%); */

        background-image: radial-gradient(
          circle at left top,
          rgb(250, 5, 5) 12%,
          rgb(243, 88, 93) 24%,
          rgb(247, 144, 144) 67%,
          rgb(245, 191, 117) 100%
        );

        .div.ls4 {
          font-size: 3rem;
          font-weight: bold;
          background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          color: transparent; /* 備用方案 */
        }
      }
    </style>
  </head>

  <body>
    <div class="ls4"></div>
    <hr />
    <div class="ls3"></div>
    <hr />
    <div class="ls1"></div>
    <hr />
    <div class="ls2"></div>
    <hr />
  </body>
</html>
