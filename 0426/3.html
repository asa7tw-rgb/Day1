<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

.container {
    background-color: lightcyan;
    width: 100%;
    height: 800px;
    display: flex;
    flex-wrap: nowrap;
    flex-direction: r;
    justify-content:flex-start;
    align-items: flex-end;

    



    .item {
      width: 100px;
      height: 100px;
      background-color: lightgoldenrodyellow;
      border: 1px solid black;
           
    }
     .box2 {
        flex-basis: 200px;
     }
     .box4 {
        flex-basis: 100px;
    }
}

    </style>
</head>
<body>
 <div class="container">
    <div class="item" style="height: 100px; color: red">A</div>
    <div class="item box2" style="color: blue;">B</div>
    <div class="item">C</div>
    <div class="item box4">D</div>

</div>   
</body>

</html>
